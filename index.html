
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simon Says Game</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Main Game Container -->
    <div class="game-container">


        <!-- Game Heading -->
        <div class="game-header">

            <h1 id="game-title">Simon Says Game</h1>

            <!-- Creator Name -->
            <p id="creator-name">
                Created by RANVEER SINGH MAURYA
            </p>

            <p id="game-status">
                Press the Start Game button to play!
            </p>

        </div>


        <!-- Simon Device -->
        <div id="simon-device">


            <!-- Green Button -->
            <div class="game-button green" id="green"></div>


            <!-- Red Button -->
            <div class="game-button red" id="red"></div>


            <!-- Yellow Button -->
            <div class="game-button yellow" id="yellow"></div>


            <!-- Blue Button -->
            <div class="game-button blue" id="blue"></div>


            <!-- Center Panel -->
            <div class="center-panel">


                <!-- Power Button -->
                <div class="power-button">

                    <div class="power-light"></div>

                </div>


                <!-- Simon Logo -->
                <h1 class="logo">SIMON</h1>


                <!-- Speaker -->
                <div class="speaker">

                    <div class="speaker-grill"></div>

                </div>


            </div>


        </div>


        <!-- Start Game Button -->
        <button id="start-button">
            Start Game
        </button>


        <!-- How to Play Button -->
        <button id="how-to-play-button">
            How to Play
        </button>


        <!-- Tutorial Links -->
        <div id="tutorial-links">

            <!-- English Tutorial -->
            <a href="https://www.youtube.com/watch?v=EWJ5uYwQJGU"
               target="_blank"
               rel="noopener noreferrer">

                ▶ Watch in English

            </a>


            <!-- Hindi Tutorial -->
            <a href="https://www.youtube.com/watch?v=4uK5mCRUGJ4"
               target="_blank"
               rel="noopener noreferrer">

                ▶ हिंदी में देखें

            </a>

        </div>


    </div>


    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>

</html>
